name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# Cancel older pipeline
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: ./backend
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # Static analysis job

  test-and-build:
    name: Tests and build JAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sharing
          POSTGRES_USER: sharing
          POSTGRES_PASSWORD: sharing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Run Tests

      # Calculate test coverage

      # Publish test report

      - name: Build JAR
        run: ./gradlew build

      # Save artifact on main for Docker
      - name: Upload JAR artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*-SNAPSHOT.jar
          retention-days: 1

